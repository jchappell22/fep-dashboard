# OpenFE engine definition.
#
# EVERY command the dashboard runs against openfe lives in this file. Nothing
# in the Python code hardcodes an openfe flag. If GPU2's openfe differs from
# what's written here, fix it HERE -- no code change, no redeploy.
#
# Driven through the shared /opt launcher at /usr/local/bin/openfe
# (-> /opt/openfe/openfe-launcher.sh), which activates the right conda env
# internally. No personal miniconda, no `conda activate` in the driver.
#
# Flags verified against openfe 1.10.0 locally (`openfe plan-rbfe-network
# --help`, `openfe gather --help`, `openfe quickrun --help`). The box's
# default is 1.11.1, with 1.12.0 and 1.8.1 also installed; if a flag moved
# between those, fix it HERE.
#
# Placeholders in `cmd` strings are rendered by core/engines/base.py. The
# available ones are listed per-section below. Unknown placeholders are a
# hard error at render time, not a silent empty string.

name = "openfe"
label = "OpenFE (shared /opt install, OpenMM relative hybrid topology)"
methods = ["rbfe", "abfe"]

# OpenFE has no GPU scheduler of its own, so the dashboard pins one leg per
# card and the Launch page offers an explicit GPU picker.
gpu_selection = "explicit"

[env]
# Already on PATH via /usr/local/bin -- no conda handling required.
binary = "openfe"

# Versions installed under /opt/openfe. The Launch page turns this into a
# dropdown; the chosen value is exported as OPENFE_VERSION, which the
# launcher reads to pick an env for the call. Leaving it unset uses
# /opt/openfe/current.
[env.versions]
default = ""                       # "" -> whatever `current` points at (1.11.1)
available = ["", "1.12.0", "1.11.1", "1.8.1"]
env_var = "OPENFE_VERSION"

[env.exports]
# Partial-charge generation during planning parallelises via -n; letting
# each worker also spin up OpenMM CPU threads oversubscribes the box.
OPENMM_CPU_THREADS = "1"


# --------------------------------------------------------------------------
# RBFE
# --------------------------------------------------------------------------

[rbfe.plan]
# Placeholders: {ligands} {protein} {plan_dir} {n_repeats} {n_cores}
#               {opt_cofactors} {opt_settings}
# The {opt_*} ones render to "" when the campaign leaves them unset, or to
# " -C /path" / " -s /path" when set -- note the leading space is included.
cmd = """
openfe plan-rbfe-network \
  -M {ligands} \
  -p {protein} \
  -o {plan_dir} \
  --n-protocol-repeats {n_repeats} \
  -n {n_cores}{opt_cofactors}{opt_settings}
"""
# Planning also generates am1bcc partial charges, so it is CPU-heavy and can
# take many minutes on a large ligand set. It runs as its own driver stage.
stage_label = "plan network + charge ligands"

# Where per-edge transformation JSONs land under plan_dir, and where the
# ligand network graph lands. Both relative to plan_dir.
jobs_glob = "transformations/*.json"
network_graphml = "ligand_network.graphml"

[rbfe.run]
# One openfe process per leg. The driver fans these out across the selected
# GPUs, one leg per GPU at a time, pulling from a shared queue.
#
# Placeholders: {job} {leg} {results_dir} {work_dir} {logs_dir} {opt_resume}
cmd = """
openfe quickrun {job} \
  -o {results_dir}/{leg}.json \
  -d {work_dir}/{leg}{opt_resume}
"""
# "per_gpu"  -- dashboard fans legs out over CUDA_VISIBLE_DEVICES
# "single"   -- one process; the engine does its own GPU scheduling
parallel = "per_gpu"
# A leg counts as finished when this file exists (relative to campaign root).
done_marker = "results/{leg}.json"

[rbfe.gather]
# Placeholders: {results_dir} {gathered_dir}
#
# --allow-partial lets the tables build while legs are still in flight, which
# is what makes the Results page useful mid-campaign. Without it gather hard-
# errors on any incomplete edge.
cmds = [
  "openfe gather {results_dir} --report ddg --allow-partial -o {gathered_dir}/ddg.tsv",
  "openfe gather {results_dir} --report dg  --allow-partial -o {gathered_dir}/dg.tsv",
  "openfe gather {results_dir} --report raw --allow-partial -o {gathered_dir}/raw.tsv",
]
ddg_table = "ddg.tsv"
dg_table = "dg.tsv"
raw_table = "raw.tsv"
table_format = "tsv"

# `openfe gather --report dg` needs >= 2 protocol repeats per edge to build
# the MLE. Surfaced in the launch form so nobody discovers it 18h in.
min_repeats_for_dg = 2


# --------------------------------------------------------------------------
# ABFE
# --------------------------------------------------------------------------
#
# openfe 1.10 has `gather-abfe` but no `plan-abfe-network` CLI -- ABFE setup
# goes through the Python layer. The dashboard therefore calls a small setup
# shim shipped in scripts/ rather than an openfe subcommand.

[abfe.plan]
# Placeholders: {ligands} {protein} {plan_dir} {n_repeats} {n_cores}
#               {opt_cofactors} {opt_settings} {scripts_dir}
#
# NOTE the explicit interpreter. The `openfe` launcher activates its env only
# for its own subcommands -- it cannot run an arbitrary script -- so the shim
# must be invoked with an OpenFE env's python directly. Change the path here
# if you pin a non-default version for an ABFE campaign; unlike the RBFE path,
# OPENFE_VERSION has no effect on this line.
cmd = """
/opt/openfe/current/bin/python {scripts_dir}/openfe_setup_abfe.py \
  --ligands {ligands} \
  --protein {protein} \
  --output-dir {plan_dir} \
  --n-protocol-repeats {n_repeats} \
  --n-processors {n_cores}{opt_cofactors}{opt_settings}
"""
stage_label = "build ABFE transformations"
jobs_glob = "transformations/*.json"
network_graphml = ""

[abfe.run]
cmd = """
openfe quickrun {job} \
  -o {results_dir}/{leg}.json \
  -d {work_dir}/{leg}{opt_resume}
"""
parallel = "per_gpu"
done_marker = "results/{leg}.json"

[abfe.gather]
# NOTE: `gather-abfe` is flagged experimental by openfe itself, and unlike
# `gather` it has NO --allow-partial (verified on 1.10.0). It therefore only
# succeeds once every leg is done; the driver tolerates a non-zero exit here
# and the Results page falls back to "not gathered yet".
cmds = [
  "openfe gather-abfe {results_dir} --report dg  -o {gathered_dir}/dg.tsv",
  "openfe gather-abfe {results_dir} --report raw -o {gathered_dir}/raw.tsv",
]
ddg_table = ""
dg_table = "dg.tsv"
raw_table = "raw.tsv"
table_format = "tsv"
min_repeats_for_dg = 1


# ==========================================================================
# Network planning settings -- rendered into the YAML passed via `-s`
# ==========================================================================
#
# The dashboard builds the settings YAML from these declarations, so the
# Launch page can steer planning without anyone hand-writing a file.
#
# This covers the COMPLETE surface `openfe plan-rbfe-network -s` accepts:
# `parse_yaml_planner_options` recognises exactly `mapper`, `network`, and
# `partial_charge` and warns about anything else.
#
# Method `value`s below are the literal lowercase registry keys from
# openfecli.parameters.plan_network_options (the pydantic models set
# str_to_lower=True and the lookup dicts are keyed lowercase). Do not put a
# display name here -- `label` is for that.
#
# TO ADD A FIELD: append a [[...fields]] entry with name/type/default and the
# `applies_to` methods it belongs to. No Python change needed.
#
# Field `default`s are OPENFE'S CLI DEFAULTS, which for Kartograf are not the
# same as the class defaults -- openfe's no-YAML path deliberately sets
# map_hydrogens_on_hydrogens_only=true, calling it a "non-default setting".
# Because a supplied YAML is applied as `cls(**settings)`, every omitted key
# falls back to the CLASS default. So the dashboard always emits these
# explicitly rather than omitting ones that look default: omitting would
# silently change mapping behaviour relative to plain `openfe`.

# ---- atom mapper ---------------------------------------------------------

[rbfe.settings.mapper]
label = "Atom mapper"
default = "kartograf"
help = "How atoms are matched between the two ligands of an edge. A bad mapping is the most common cause of an edge that will not converge."

[[rbfe.settings.mapper.choices]]
value = "kartograf"
label = "Kartograf (openfe default)"
help = "Geometry-based. Default since openfe 1.7.0."

[[rbfe.settings.mapper.choices]]
value = "lomap"
label = "LOMAP"
help = "The older MCS-based mapper."

[[rbfe.settings.mapper.fields]]
name = "atom_max_distance"
type = "float"
default = 0.95
step = 0.05
applies_to = ["kartograf"]
help = "Maximum distance (Å) between two atoms for them to be mapped onto each other."

[[rbfe.settings.mapper.fields]]
name = "atom_map_hydrogens"
type = "bool"
default = true
applies_to = ["kartograf"]
help = "Include hydrogens in the mapping."

[[rbfe.settings.mapper.fields]]
name = "map_hydrogens_on_hydrogens_only"
type = "bool"
default = true
applies_to = ["kartograf"]
help = "Only map hydrogens to other hydrogens. openfe's CLI turns this ON even though the Kartograf class default is off -- constraint correction removes these later anyway."

[[rbfe.settings.mapper.fields]]
name = "map_exact_ring_matches_only"
type = "bool"
default = true
applies_to = ["kartograf"]
help = "Only map rings onto structurally identical rings."

[[rbfe.settings.mapper.fields]]
name = "allow_partial_fused_rings"
type = "bool"
default = true
applies_to = ["kartograf"]
help = "Permit mapping part of a fused ring system."

[[rbfe.settings.mapper.fields]]
name = "allow_bond_breaks"
type = "bool"
default = false
applies_to = ["kartograf"]
help = "Permit mappings that break a bond. Usually leave off -- these edges converge poorly."

[[rbfe.settings.mapper.fields]]
name = "time"
type = "int"
default = 20
applies_to = ["lomap"]
help = "Seconds allowed for the MCS search per pair."

[[rbfe.settings.mapper.fields]]
name = "threed"
type = "bool"
default = true
applies_to = ["lomap"]
help = "Use 3D coordinates to disambiguate the MCS."

[[rbfe.settings.mapper.fields]]
name = "max3d"
type = "float"
default = 1.0
step = 0.1
applies_to = ["lomap"]
help = "Maximum 3D distance (Å) between mapped atoms."

[[rbfe.settings.mapper.fields]]
name = "element_change"
type = "bool"
default = true
applies_to = ["lomap"]
help = "Allow an atom to change element across the mapping."

[[rbfe.settings.mapper.fields]]
name = "shift"
type = "bool"
default = false
applies_to = ["lomap"]
help = "Shift the two molecules onto a common centroid before mapping."

[[rbfe.settings.mapper.fields]]
name = "seed"
type = "str"
default = ""
optional = true
applies_to = ["lomap"]
help = "SMARTS seed for the MCS search. Leave blank to omit."

# ---- network planner -----------------------------------------------------

[rbfe.settings.network]
label = "Network planner"
default = "generate_minimal_spanning_network"
help = "Which edges get simulated. Redundancy costs GPU time but is what makes the cycle-closure check on the Results page able to tell you anything."

[[rbfe.settings.network.choices]]
value = "generate_minimal_spanning_network"
label = "Minimal spanning (openfe default)"
help = "Fewest edges that connect every ligand. Cheapest, but a tree has no cycles -- the Results page cannot check consistency."

[[rbfe.settings.network.choices]]
value = "generate_minimal_redundant_network"
label = "Minimal redundant"
help = "Spanning network repeated N times, so every ligand has N independent paths. Recommended if you intend to trust the ranking."

[[rbfe.settings.network.choices]]
value = "generate_lomap_network"
label = "LOMAP network"
help = "LOMAP's own heuristics, including cycle covering."

[[rbfe.settings.network.choices]]
value = "generate_radial_network"
label = "Radial (star)"
help = "Every ligand mapped to one central hub ligand. Requires a hub."

[[rbfe.settings.network.choices]]
value = "generate_maximal_network"
label = "Maximal (all pairs)"
help = "Every pair. Edge count grows as N^2 -- this gets expensive fast."

[[rbfe.settings.network.fields]]
name = "mst_num"
type = "int"
default = 2
min = 1
max = 10
applies_to = ["generate_minimal_redundant_network"]
help = "How many independent spanning networks to overlay. 2 gives every ligand two disjoint paths."

[[rbfe.settings.network.fields]]
name = "central_ligand"
type = "str"
default = ""
required = true
applies_to = ["generate_radial_network"]
help = "Name of the hub ligand. Must match exactly one molecule title in the SDF."

[[rbfe.settings.network.fields]]
name = "distance_cutoff"
type = "float"
default = 0.4
step = 0.05
applies_to = ["generate_lomap_network"]
help = "Minimum LOMAP similarity score for an edge to be considered."

[[rbfe.settings.network.fields]]
name = "max_path_length"
type = "int"
default = 6
applies_to = ["generate_lomap_network"]
help = "Longest path allowed between any two ligands."

[[rbfe.settings.network.fields]]
name = "require_cycle_covering"
type = "bool"
default = true
applies_to = ["generate_lomap_network"]
help = "Ensure every ligand sits in a cycle. Keep on -- this is what makes cycle closure meaningful."

[[rbfe.settings.network.fields]]
name = "radial"
type = "bool"
default = false
applies_to = ["generate_lomap_network"]
help = "Build a star network around a hub instead."

[[rbfe.settings.network.fields]]
name = "fast"
type = "bool"
default = false
applies_to = ["generate_lomap_network"]
help = "Skip some of the more expensive graph refinement."

[[rbfe.settings.network.fields]]
name = "hub"
type = "str"
default = ""
optional = true
applies_to = ["generate_lomap_network"]
help = "Hub ligand name, used when `radial` is on. Leave blank to omit."

# ---- partial charges -----------------------------------------------------

[rbfe.settings.partial_charge]
label = "Partial charges"
default = "am1bcc"
help = "Generated once up front for every ligand, so the whole network shares one consistent set. This is the CPU-bound part of planning."

[[rbfe.settings.partial_charge.choices]]
value = "am1bcc"
label = "AM1BCC / AmberTools (recommended)"
help = "The only combination verified installed on this box. Also matches TMD's smirnoff_2_2_1_amber_am1bcc default, which is what makes the two engines comparable on the same series."

[[rbfe.settings.partial_charge.choices]]
value = "am1bccelf10"
label = "AM1BCC ELF10 — needs OpenEye (NOT licensed here)"
available = false
help = "Requires the OpenEye toolkits, which the /opt install README states are not licensed on this box. Will fail."

[[rbfe.settings.partial_charge.choices]]
value = "nagl"
label = "NAGL — needs openff-nagl"
available = false
help = "Requires openff-nagl in the OpenFE env. Check before selecting."

[[rbfe.settings.partial_charge.choices]]
value = "espaloma"
label = "Espaloma — needs espaloma_charge"
available = false
help = "Requires espaloma_charge in the OpenFE env. Check before selecting."

[[rbfe.settings.partial_charge.fields]]
name = "off_toolkit_backend"
type = "choice"
default = "ambertools"
options = ["ambertools", "openeye", "rdkit"]
applies_to = ["am1bcc", "am1bccelf10", "nagl", "espaloma"]
help = "Toolkit used to run the charge assignment. `openeye` is not licensed on this box."

[[rbfe.settings.partial_charge.fields]]
name = "number_of_conformers"
type = "int"
default = 0
optional = true
applies_to = ["am1bcc", "am1bccelf10"]
help = "Conformers to average charges over. 0 = omit the key and let openfe decide (its own default is None)."

[[rbfe.settings.partial_charge.fields]]
name = "nagl_model"
type = "str"
default = ""
optional = true
applies_to = ["nagl"]
help = "NAGL model file. Leave blank to omit."
