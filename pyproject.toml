# fep-dashboard packaging metadata.
#
# Ranges here for ecosystem compatibility; reproducible pins live in
# requirements.txt.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fep-dashboard"
version = "0.1.0"
description = "Streamlit UI over the shared OpenFE and TMD installs."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "streamlit>=1.35,<2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    # tomllib joined stdlib in 3.11; tomli is the same parser for 3.10.
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps `pytest` working from a bare checkout without an editable install,
# which is how this gets run on the box.
pythonpath = ["src"]
